version: "3.8"

services:
  frontend:
    build:
      context: ./frontend        # Path to your frontend folder
      dockerfile: Dockerfile     # Your frontend Dockerfile
    ports:
      - "8080:80"                # Expose frontend on localhost:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./backend         # Path to your backend folder
      dockerfile: Dockerfile     # Your Node.js backend Dockerfile
    ports:
      - "5000:5000"              # Expose backend on localhost:5000
